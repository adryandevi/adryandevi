# Generates the contribution-graph snake for the GitHub profile README.
#
# This file does NOT belong in the portfolio repo. Put it in the profile
# repo (adryandevi/adryandevi) at:  .github/workflows/snake.yml
#
# It runs daily, redraws the snake from the contribution graph, and pushes
# the SVG to an "output" branch, which the README then links to.
#
# Colours follow the site: dots ramp from the section navy to purple-400,
# and the snake itself is the accent purple.

name: Generate snake animation

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 03:00 UTC
  workflow_dispatch:      # adds a "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Draw the snake from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#c084fc&color_dots=#012a4f,#3a2a72,#6d3fa8,#9d5ce6,#c084fc

      - name: Publish it to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
